<!DOCTYPE html>
<html lang="en" class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>Learning notes</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            :root {
                --ink: #111111;
                --muted: #5a5a5a;
                --rule: #dddddd;
                --accent: #1a5f7a;
                --serif: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
                --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
            }

            * { box-sizing: border-box; }

            .staticrypt-html,
            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-body,
            .staticrypt-content {
                background: #fffff8;
                color: var(--ink);
                font-family: var(--serif);
                line-height: 1.5;
                -webkit-font-smoothing: antialiased;
            }

            .staticrypt-content { min-height: 100%; }

            .staticrypt-page {
                width: 100%;
                max-width: 26rem;
                margin: 0 auto;
                padding: 12vh 1.25rem 3rem;
            }

            .staticrypt-form {
                background: #ffffff;
                border: 1px solid var(--rule);
                margin: 0;
                max-width: none;
                padding: 1.6rem 1.25rem 1.35rem;
                text-align: left;
            }

            .staticrypt-instructions { margin: 0 0 1rem; }

            .staticrypt-title {
                font-size: 1.7rem;
                font-weight: 400;
                line-height: 1.2;
                margin: 0 0 0.45rem;
            }

            .staticrypt-instructions p:last-child {
                color: var(--muted);
                font-size: 1.02rem;
                font-style: italic;
                margin: 0;
            }

            .staticrypt-hr {
                border: 0;
                border-top: 1px solid var(--rule);
                margin: 0 0 1.1rem;
            }

            .staticrypt-password-container {
                background: #fffff8;
                border: 1px solid var(--rule);
                margin: 0 0 0.9rem;
                position: relative;
            }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: transparent;
                border: 0;
                color: var(--ink);
                font-family: var(--serif);
                font-size: 16px;
                outline: none;
                padding: 0.85rem 2.7rem 0.85rem 0.8rem;
                width: 100%;
            }

            .staticrypt-form input[type="password"]:focus,
            .staticrypt-form input[type="text"]:focus {
                box-shadow: inset 0 0 0 2px var(--accent);
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 0.6;
                padding: 12px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

            label.staticrypt-remember {
                align-items: center;
                color: var(--ink);
                display: flex;
                font-family: var(--sans);
                font-size: 0.85rem;
                gap: 0.6rem;
                margin: 0 0 1rem;
            }

            .staticrypt-remember input[type="checkbox"] {
                accent-color: var(--accent);
                height: 1.05rem;
                margin: 0;
                width: 1.05rem;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                background: var(--accent);
                border: 0;
                color: #ffffff;
                cursor: pointer;
                font-family: var(--sans);
                font-size: 0.85rem;
                letter-spacing: 0.06em;
                padding: 0.85rem 1rem;
                width: 100%;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                filter: brightness(92%);
            }

            .hidden { display: none !important; }

            .staticrypt-spinner-container {
                align-items: center;
                display: flex;
                height: 100%;
                justify-content: center;
            }

            .staticrypt-spinner {
                animation: spinner-border 0.75s linear infinite;
                border: 0.18em solid #c8c8c0;
                border-radius: 50%;
                border-right-color: transparent;
                height: 1.6rem;
                width: 1.6rem;
            }

            @keyframes spinner-border {
                100% { transform: rotate(360deg); }
            }

            @media (max-width: 480px) {
                .staticrypt-page { padding-top: 8vh; }
            }
        </style>
    </head>

                    </form>
                </div>
            </div>
